<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1726"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#adc2f3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base background with rounded corners and subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(181, 198, 222, 0.18)" stroke-width="1.5"/>

  <!-- Aesthetic Letter D -->
  <path d="M19 16h11c8.5 0 15 6 15 16s-6.5 16-15 16H19V16zm8 8v16h3c4 0 7-3 7-8s-3-8-7-8h-3z" fill="url(#textGrad)" filter="url(#glow)"/>

  <!-- Vibrant mint accent dot -->
  <circle cx="47" cy="47" r="4.5" fill="#82e8cb" filter="url(#glow)"/>
  <circle cx="47" cy="47" r="2" fill="#0f1726"/>
</svg>
